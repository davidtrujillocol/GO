<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Space Academy - Terminal Interactiva</title>
    <style>
        :root {
            --bg-color: #0B0C10;
            --panel-bg: #1F2833;
            --text-color: #C5C6C7;
            --primary-color: #00ADD8;
            --accent-color: #66FCF1;
            --error-color: #ff7b72;
            --border-color: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: clamp(2rem, 3vw, 3rem);
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.05rem;
            color: #dfe6ee;
        }

        .terminal-container {
            display: flex;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .panel {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 420px;
        }

        .panel-header {
            background-color: #000;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 420px;
            background-color: var(--panel-bg);
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            padding: 1rem;
            border: none;
            resize: none;
            outline: none;
        }

        #output {
            padding: 1rem;
            font-family: "Courier New", Courier, monospace;
            white-space: pre-wrap;
            height: 420px;
            overflow-y: auto;
            color: #a5d6ff;
            line-height: 1.5;
        }

        .error-msg {
            color: var(--error-color);
        }

        .info-msg {
            color: #888;
        }

        .btn-launch {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: 1rem;
        }

        .btn-launch:hover {
            background-color: var(--accent-color);
        }

        .btn-launch:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #ddd;
        }

        @media (max-width: 900px) {
            .terminal-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 Simulador de Vuelo Go</h1>
        <p>Escribe tu código y envíalo a los servidores de la Tierra para su ejecución.</p>
    </div>

    <div class="terminal-container">
        <div class="panel">
            <div class="panel-header">
                <span>[ TERMINAL DE COMANDOS ] main.go</span>
                <button id="runBtn" type="button" class="btn-launch">▶ EJECUTAR</button>
            </div>
            <textarea id="codeEditor" spellcheck="false">package main

import "fmt"

func main() {
    sistema := "Navegación"
    estado := "Óptimo"

    fmt.Printf("Sistema de %s: %s\n", sistema, estado)
    fmt.Println("¡Listo para el despegue!")
}</textarea>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>[ RADAR DE SALIDA ] stdout</span>
            </div>
            <div id="output">Esperando telemetría...</div>
        </div>
    </div>

    <script>
        // Ruta relativa: funciona con cualquier dominio de Vercel (go-simulator.vercel.app)
        const PROXY_URL = "/api/compile";

        const outputDiv = document.getElementById("output");
        const runBtn = document.getElementById("runBtn");
        const codeEditor = document.getElementById("codeEditor");

        function showMessage(text, className) {
            const span = document.createElement("span");
            if (className) span.className = className;
            span.textContent = text;
            outputDiv.appendChild(span);
        }

        async function runGoCode() {
            const code = codeEditor.value;

            outputDiv.textContent = "";
            showMessage("Estableciendo conexión con la Tierra... compilando...", "info-msg");
            runBtn.disabled = true;

            try {
                const response = await fetch(PROXY_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code })
                });

                if (!response.ok) {
                    throw new Error("Error del backend (HTTP " + response.status + ")");
                }

                const data = await response.json();
                outputDiv.textContent = "";

                if (data.Errors) {
                    showMessage("⚠️ Falla en el sistema (Error de Compilación):\n\n" + data.Errors, "error-msg");
                } else if (data.Events && data.Events.length > 0) {
                    data.Events.forEach(event => {
                        showMessage(event.Message, event.Kind === "stderr" ? "error-msg" : "");
                    });
                } else {
                    showMessage("El programa finalizó sin imprimir datos.", "info-msg");
                }
            } catch (error) {
                console.error(error);
                outputDiv.textContent = "";
                showMessage("❌ Error de conexión o compilación.\n\n" + error.message +
                            "\n\nRevisa los Logs del proyecto en Vercel.", "error-msg");
            } finally {
                runBtn.disabled = false;
            }
        }

        runBtn.addEventListener("click", runGoCode);
    </script>
</body>
</html>
